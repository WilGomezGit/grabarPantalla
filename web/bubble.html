<!doctype html>
<html><head><meta charset="utf-8"><title>WAG Bubble</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;height:100%;-webkit-app-region:drag;user-select:none}canvas{display:block;width:100vw;height:100vh}video{display:none}</style>
</head><body>
<canvas id="c"></canvas><video id="v" muted autoplay playsinline></video>
<script src="ring.js"></script>
<script>
const q = new URLSearchParams(location.search);
const s = { shape: q.get('shape') || 'circle', color: q.get('color') || '#79c0ff', mirror: q.get('mirror') !== '0' };
const pad = +q.get('pad') || 0;
let state = 'idle';
window.wagDesktop?.onBubbleState?.(st => state = st);
const v = document.getElementById('v'), c = document.getElementById('c');
window.__log = [];
async function startCam() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { deviceId: q.get('cam') ? { exact: q.get('cam') } : undefined, width: { ideal: 640 }, height: { ideal: 640 } } });
    v.srcObject = st; v.play().catch(() => { });
    // si la cámara se corta (otro proceso la toma, glitch, desconexión) la reabrimos sola
    st.getVideoTracks()[0].addEventListener('ended', () => { __log.push('reacquire@' + Math.round(performance.now())); setTimeout(startCam, 300); });
  } catch (e) { __log.push('err ' + e.name); setTimeout(startCam, 1500); }
}
startCam();
const dpr = window.devicePixelRatio || 1;
function loop() {
  const W = innerWidth, H = innerHeight;
  if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  WAGRing.bubble(ctx, v, pad, pad, Math.min(W, H) - 2 * pad, s, state, performance.now() / 1000);
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
